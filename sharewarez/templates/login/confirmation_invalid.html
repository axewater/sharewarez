{% extends "base.html" %}
{% block content %}

<link rel="stylesheet" href="{{ 'css/login/confirmation_invalid.css'|theme_asset }}">
<div class="container-login">
    <div class="content-login">
        <img src="{{ url_for('static', filename='newstyle/sharewarez_logo.png') }}" alt="ShareWareZ Logo" class="login-logo">
        <h1 class="logo">Invalid Link</h1>
        <p>The link you've sailed upon is marooned. Check your map (email) for the rightful path, or contact an admin for a new invite.</p>
        <a href="{{ url_for('login.login') }}" class="btn btn-success">Return to Login</a>
    </div>
</div>
{% endblock %}
