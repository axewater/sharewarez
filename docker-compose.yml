# SharewareZ Docker Compose Configuration
#
# Setup Instructions:
# 1. Copy .env.docker.example to .env and customize your settings
# 2. Run: docker-compose up -d
#
# Volume Mounts:
# - DATA_FOLDER_WAREZ: Your games directory, mounted read-only to /storage
# - LIBRARY_HOST_PATH: Persistent storage for cover images, themes, and zips (default: ./data/library)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kapitanczarnobrod/sharewarez:latest
    container_name: sharewarez-app
    restart: unless-stopped
    ports:
      - "5006:5006"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${APP_DB_USER:-sharewarez_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}}
      - DATA_FOLDER_WAREZ=/storage
      - UPLOAD_FOLDER=/app/sharewarez/static/library
      - SECRET_KEY=${SECRET_KEY}
      - DEV_MODE=${DEV_MODE:-false}
      # POSTGRES_USER/PASSWORD/DB are deliberately NOT passed to the app.
      # They are the database container's bootstrap superuser, used only by the
      # `db` service below. The app authenticates as APP_DB_USER, a role that
      # owns this application's database and nothing else. Handing the app the
      # superuser password as well would give back exactly what that role is
      # there to take away.
      #
      # Built from APP_DB_USER/APP_DB_PASSWORD so the credential lives in ONE
      # place: the same two values the db service's init script uses to create
      # the role. Setting DATABASE_URL explicitly in .env still overrides this,
      # which is how installs that predate the init script keep working.
    volumes:
      - "${DATA_FOLDER_WAREZ}:/storage:ro"
      - "${LIBRARY_HOST_PATH:-./data/library}:/app/sharewarez/static/library"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5006/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:17.6
    container_name: sharewarez-db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata
      # Read by docker/initdb/01-create-app-role.sh on first initialisation only.
      - APP_DB_USER=${APP_DB_USER:-sharewarez_app}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-}
    volumes:
      - db_data:/var/lib/postgresql/data/pgdata
      # Runs once, when the data volume is empty, to create the app's role.
      # Without it a fresh install cannot authenticate at all.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
#    ports:
#      - "5432:5432"  # Optional: expose PostgreSQL port for external access

volumes:
  db_data:
    driver: local
